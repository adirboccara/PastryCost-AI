<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweetie • PastryCost AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #c97a7e;
            --primary-hover: #b5676b;
            --bg: #faf7f5;
            --card-bg: #ffffff;
            --text-main: #2d3142;
            --text-muted: #6c757d;
            --border: #f0e6e6;
            --accent: #fbf0f1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Assistant', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 580px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .header p { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.3rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; color: var(--text-main); }
        input, select {
            width: 100%; padding: 0.85rem 1rem; font-size: 0.95rem;
            border: 1.5px solid var(--border); border-radius: 10px; background-color: #fff;
            transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(201, 122, 126, 0.15); }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        button {
            width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700;
            cursor: pointer; margin-top: 1rem; transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(201, 122, 126, 0.25); font-family: inherit;
        }
        button:hover { box-shadow: 0 6px 16px rgba(201, 122, 126, 0.35); }
        #result {
            display: none; margin-top: 2rem; background: var(--accent); border-radius: 14px;
            padding: 1.5rem; border: 1px solid rgba(201, 122, 126, 0.2);
        }
        .price-box {
            display: flex; align-items: baseline; justify-content: space-between;
            border-bottom: 1px solid rgba(201, 122, 126, 0.2); padding-bottom: 0.8rem; margin-bottom: 1rem;
        }
        .price-label { font-size: 1rem; font-weight: 600; }
        .price-val { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        .res-section { margin-bottom: 1rem; font-size: 0.95rem; line-height: 1.5; }
        .res-section strong { display: block; margin-bottom: 0.2rem; color: var(--text-main); }
        .res-text { color: #444; white-space: pre-wrap; }
        .error-box {
            display: none; margin-top: 1rem; padding: 1rem; border-radius: 8px;
            background: #fff0f0; border: 1px solid #ffcccc; color: #b71c1c; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sweetie</h1>
            <p>מחשבון תמחור וניהול סיכוני פטיסרי מבוסס AI</p>
        </div>

        <form id="calcForm">
            <div class="form-group">
                <label>סוג הקינוח / מארז</label>
                <input type="text" id="itemType" required placeholder="לדוגמה: עוגת מוס 2 קומות, טארט פירות">
            </div>

            <div class="form-group">
                <label>תנאי אירוע / סביבה</label>
                <select id="environment">
                    <option value="Indoor/AC">אירוע פנים (ממוזג ויציב)</option>
                    <option value="Outdoor Summer Event">אירוע חוץ (קיץ / חום / לחות גבוהה)</option>
                    <option value="Delivery/Transit">שינוע ומשלוח ברכב</option>
                </select>
            </div>

            <div class="form-group">
                <label>עלות חומרי גלם ישירה (₪)</label>
                <input type="number" id="ingredientCost" required min="1" placeholder="80">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>שעות הכנה במטבח</label>
                    <input type="number" id="prepHours" required min="0" step="0.5" placeholder="3.5">
                </div>
                <div class="form-group">
                    <label>שעות מכירה בדוכן (פופ-אפ)</label>
                    <input type="number" id="salesHours" value="0" min="0" step="0.5">
                </div>
            </div>

            <button type="submit" id="submitBtn">נתח סיכונים והפק הצעת מחיר</button>
        </form>

        <div id="errorBox" class="error-box"></div>

        <div id="result">
            <div class="price-box">
                <span class="price-label">מחיר מומלץ כולל שולי רווח:</span>
                <span class="price-val">₪<span id="resPrice"></span></span>
            </div>
            <div class="res-section">
                <strong>הצעת מחיר מנוסחת ללקוח:</strong>
                <div id="resQuote" class="res-text"></div>
            </div>
            <div class="res-section" style="margin-bottom: 0;">
                <strong>פרוטוקול שינוע ואחסון מקצועי:</strong>
                <div id="resProtocol" class="res-text"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('calcForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const resultBox = document.getElementById('result');

            errorBox.style.display = 'none';
            resultBox.style.display = 'none';
            btn.textContent = 'הסוכן מנתח סיכונים ותמחור...';
            btn.disabled = true;

            const payload = {
                itemType: document.getElementById('itemType').value,
                environment: document.getElementById('environment').value,
                ingredientCost: Number(document.getElementById('ingredientCost').value),
                prepHours: Number(document.getElementById('prepHours').value),
                salesHours: Number(document.getElementById('salesHours').value),
                hourlyRate: 80
            };

            try {
                const response = await fetch('/.netlify/functions/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Server error ' + response.status);
                }

                document.getElementById('resPrice').textContent = data.financials.recommendedPrice;
                document.getElementById('resQuote').textContent = data.proposal.client_quote;
                document.getElementById('resProtocol').textContent = data.proposal.logistics_protocol;
                resultBox.style.display = 'block';
            } catch (err) {
                errorBox.textContent = 'שגיאה: ' + err.message;
                errorBox.style.display = 'block';
            } finally {
                btn.textContent = 'נתח סיכונים והפק הצעת מחיר';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
